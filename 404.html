<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/img/favicon-64.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Moodle by KelsonCM — page not found</title>
  <script>
    // Repositórios renomeados para moodle-{plugintype}_{pluginname}: leva qualquer página
    // do endereço antigo (/<antigo>/...) para o mesmo caminho no endereço novo.
    (function () {
      var renamed = ["editor_tiptap", "enrol_conditional", "local_enrolconditions", "mod_imagemap",
        "tiny_justify", "tiny_toolbar", "tool_participantscustomfilter"];
      // Forks transferidos para a organização forks-by-kelsoncm.
      var moved = ["tiny_fileimport", "tiny_fontsize", "tiny_fontfamily"];
      var parts = window.location.pathname.split("/");
      var name = parts.length > 1 ? parts[1].replace(/^moodle-/, "") : "";
      if (moved.indexOf(name) !== -1) {
        parts[1] = "moodle-" + name;
        window.location.replace("https://forks-by-kelsoncm.github.io" + parts.join("/") + window.location.search + window.location.hash);
        return;
      }
      if (parts.length > 1 && renamed.indexOf(parts[1]) !== -1) {
        parts[1] = "moodle-" + parts[1];
        window.location.replace(parts.join("/") + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <p>Page not found. <a href="/">Moodle by KelsonCM</a></p>
  <p>Página não encontrada. <a href="/">Moodle by KelsonCM</a></p>
</body>
</html>
